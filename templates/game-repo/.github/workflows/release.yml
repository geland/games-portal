name: Publish game release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable version (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      commit_sha:
        description: Exact full 40-character Git commit SHA to build
        required: true
        type: string
      resume_existing:
        description: Resume only after verifying every existing immutable byte
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      resume: ${{ steps.release.outputs.resume }}
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve immutable release identity
        id: release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_INPUT_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_INPUT_RESUME: ${{ inputs.resume_existing }}
          RELEASE_HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          if [[ "${actual_head}" != "${RELEASE_HEAD,,}" ]]; then
            echo "Checkout did not resolve to the requested commit" >&2
            exit 1
          fi
          RELEASE_HEAD="${actual_head}" node .github/release-tools/config.mjs resolve-release

  release:
    needs: authorize
    runs-on: macos-15
    timeout-minutes: 120
    environment:
      name: production
      url: https://games.gregeland.com
    steps:
      - name: Check out the authorized commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/release-tools/package-lock.json

      - name: Install audited release dependencies
        run: npm ci --prefix .github/release-tools --ignore-scripts --no-audit

      - name: Test release tooling
        run: npm test --prefix .github/release-tools

      - name: Read release configuration
        id: game
        run: node .github/release-tools/config.mjs outputs

      - name: Verify authorized checkout
        env:
          EXPECTED_COMMIT: ${{ needs.authorize.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"

      - name: Install pinned Godot and export templates
        run: bash .github/scripts/install-godot.sh

      - name: Stage a sanitized Web project copy
        if: steps.game.outputs.web_enabled == 'true'
        env:
          PROJECT_PATH: ${{ steps.game.outputs.project_path }}
          RELEASE_TARGET: web
        run: bash .github/scripts/stage-project.sh

      - name: Import and test the Web stage
        if: steps.game.outputs.web_enabled == 'true'
        run: bash .github/scripts/validate-project.sh

      - name: Build and inspect Web export
        if: steps.game.outputs.web_enabled == 'true'
        env:
          WEB_PRESET: ${{ steps.game.outputs.web_preset }}
          WEB_ENTRY: ${{ steps.game.outputs.web_entry }}
          WEB_BUILD_DIR: ${{ runner.temp }}/gregeland-release/web
        run: bash .github/scripts/build-web.sh

      - name: Stage a fresh sanitized Mac project copy
        if: steps.game.outputs.mac_enabled == 'true'
        env:
          PROJECT_PATH: ${{ steps.game.outputs.project_path }}
          RELEASE_TARGET: mac
        run: bash .github/scripts/stage-project.sh

      - name: Apply the approved Mac release version
        if: steps.game.outputs.mac_enabled == 'true'
        env:
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: node .github/release-tools/config.mjs set-mac-version "${RELEASE_VERSION}"

      - name: Import and test the Mac stage
        if: steps.game.outputs.mac_enabled == 'true'
        run: bash .github/scripts/validate-project.sh

      - name: Build unsigned universal macOS app
        if: steps.game.outputs.mac_enabled == 'true'
        env:
          MAC_PRESET: ${{ steps.game.outputs.mac_preset }}
          MAC_BUNDLE_NAME: ${{ steps.game.outputs.mac_bundle_name }}
          MAC_BUILD_DIR: ${{ runner.temp }}/gregeland-release/macos
        run: bash .github/scripts/build-macos.sh

      - name: Sign, notarize, staple, and archive macOS app
        if: steps.game.outputs.mac_enabled == 'true'
        env:
          MAC_APP: ${{ runner.temp }}/gregeland-release/macos/${{ steps.game.outputs.mac_bundle_name }}.app
          MAC_ARCHIVE: ${{ runner.temp }}/gregeland-release/${{ steps.game.outputs.slug }}-macos-universal.zip
          MAC_ENTITLEMENTS: ${{ steps.game.outputs.mac_entitlements }}
          MAC_EXPECTED_VERSION: ${{ needs.authorize.outputs.version }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash .github/scripts/sign-notarize-macos.sh

      - name: Publish immutable objects and promote stable last
        env:
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
          SOURCE_COMMIT: ${{ needs.authorize.outputs.commit }}
          ALLOW_RESUME: ${{ needs.authorize.outputs.resume }}
          GAME_SLUG: ${{ vars.GAME_SLUG }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          WEB_BUILD_DIR: ${{ runner.temp }}/gregeland-release/web
          MAC_ARCHIVE: ${{ runner.temp }}/gregeland-release/${{ steps.game.outputs.slug }}-macos-universal.zip
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node .github/release-tools/publish-release.mjs
